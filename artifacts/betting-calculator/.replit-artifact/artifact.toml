kind = "web"
previewPath = "/"
title = "Betting Calculator"
version = "1.0.0"
id = "artifacts/betting-calculator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20840

[services.development]
run = "pnpm --filter @workspace/betting-calculator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/betting-calculator", "run", "build" ]
publicDir = "artifacts/betting-calculator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20840"
BASE_PATH = "/"
